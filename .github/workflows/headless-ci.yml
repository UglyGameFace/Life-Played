name: Headless CI

on:
  pull_request:
    paths:
      - "server/**"
      - "tests/**"
      - "global.json"
      - "Directory.Build.props"
      - "Directory.Packages.props"
      - "LifePlayed.slnx"
      - ".github/workflows/headless-ci.yml"
  push:
    branches:
      - main
    paths:
      - "server/**"
      - "tests/**"
      - "global.json"
      - "Directory.Build.props"
      - "Directory.Packages.props"
      - "LifePlayed.slnx"
      - ".github/workflows/headless-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore LifePlayed.slnx

      - name: Build
        run: dotnet build LifePlayed.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test LifePlayed.slnx --configuration Release --no-build
